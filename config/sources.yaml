    - {url: "https://www.ukrinform.net/rss/block-lastnews", name: ukrinform-en, language: en, country: UA}
    - {url: "https://www.timesofisrael.com/feed/", name: times-of-israel, language: en, country: IL}
    - {url: "https://www.longwarjournal.org/feed", name: long-war-journal, language: en, country: US}
    - {url: "https://www.crisisgroup.org/rss.xml", name: crisis-group, language: en, country: BE}
