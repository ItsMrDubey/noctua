# Event building (pipeline stages 3, 8, 9): clustering thresholds, GDELT adjudication,
# status levels and confidence weights. Read by osint.pipeline.events.EventsConfig.

interval_s: 60            # EventBuilder pass interval
min_relevance: 0.35       # triage relevance a document needs to join an existing event
# relevance an article needs to CREATE an event. 0.5 = a strong category term in the title
# (one strong title term alone scores 1 - e^-1 = 0.63; a strong term only in the snippet
# scores 0.45, weak terms 0.30 each), so incidental or snippet-only mentions cannot spawn
# events, they can only join one.
min_relevance_create: 0.5
# an event's location is the primary article's best gazetteer hit whose matched text is in
# its own title/snippet with at least this confidence (country level: named in the title)
min_place_confidence: 0.65
cursor_overlap_min: 10    # re-read documents fetched this long before the cursor (late writes)
batch_limit: 20000        # max documents read from the lake per pass
# false: an article with no text-supported place still creates an event, with
# precision 'unlocated' (no coordinates; hidden from the map, listed with include_unlocated)
require_location: false

# Categories that need a concrete action keyword (triage.yaml term syntax: word* = prefix,
# {language: [...]}) in the title/snippet; without one the category is dropped from the
# document (commentary / opinion / "X defends his closeness to Y" is not an event).
category_gates:
  political:
    en: [sanction*, expel*, expulsion*, ceasefire, cease-fire, truce, coup, resign*,
         arrest*, impeach*, treaty signed, signs treaty, signed treaty, signs a treaty,
         signed a treaty, talks collapse*, recall* ambassador*, recall* its ambassador*,
         declares emergency, declared emergency, state of emergency, martial law,
         military mobili*, partial mobili*, general mobili*, mobilization order,
         mobilisation order, mobilizes troops, mobilises troops, mobilizes reservists,
         mobilises reservists, annex*, wins election, won election, wins the election, won the election,
         wins presidential, wins presidency, election result*, election win, elected president,
         elected prime minister, sworn in, no-confidence, no confidence vote, ousted, oust*,
         dissolve* parliament, vetoe*, vetoed, peace deal, peace agreement, signs agreement,
         signed agreement, severs ties, cuts ties, cut ties, breaks off relations, detain*,
         travel ban, visa ban, ultimatum, embargo, extradit*, assassinat*, snap election,
         calls election, referendum result*, wins referendum]
    ru: [санкци*, выслал*, высыл*, выдвор*, перемири*, переворот*, отставк*, арест*, задержан*,
         импичмент*, аннекси*, мобилизаци*, чрезвычайное положение, военное положение,
         отозвал* посла, подписал* договор*, подписал* соглашени*, победил* на выборах,
         итоги выборов, эмбарго, ультиматум*]
    uk: [санкці*, вислал*, видвор*, перемир*, переворот*, відставк*, арешт*, затриман*,
         імпічмент*, анексі*, мобілізаці*, надзвичайний стан, воєнний стан, відкликал* посла,
         підписал* угод*, переміг* на виборах, підсумки виборів, ембарго, ультиматум*]
    ar: [عقوبات, طرد, وقف إطلاق النار, هدنة, انقلاب, استقالة, اعتقال, عزل, ضم, تعبئة,
         حالة الطوارئ, استدعاء السفير, نتائج الانتخابات, فوز, حظر]
    fa: [تحریم*, اخراج, آتش‌بس, کودتا, استعفا, بازداشت, استیضاح, حالت فوق‌العاده]
    fr: [sanction*, expuls*, cessez-le-feu, trêve, coup d'état, démission*, arrestation*,
         interpellé*, destitution, annex*, mobilisation générale, état d'urgence, loi martiale,
         rappelle son ambassadeur, remporte l'élection, résultats des élections, embargo]
    es: [sanción, sanciones, sanciona*, expuls*, alto el fuego, tregua, golpe de estado,
         dimite, dimisión, renuncia*, arrest*, detenid*, destitu*, anexi*, movilización militar,
         movilización general,
         estado de emergencia, gana las elecciones, resultados electorales, embargo]
    de: [sanktion*, ausweis*, waffenstillstand*, waffenruhe, putsch*, rücktritt*, festnahme*,
         verhaftet*, festgenommen, amtsenthebung*, annexion*, mobilmachung*,
         ausnahmezustand*, wahl gewonnen, wahlergebnis*, embargo]
    tr: [yaptırım*, sınır dışı, ateşkes*, darbe*, istifa*, gözaltı*, tutuklan*, azil*,
         ilhak*, seferberlik*, olağanüstü hal]
    zh: [制裁, 驱逐, 停火, 政变, 辞职, 逮捕, 弹劾, 吞并, 动员, 紧急状态, 召回大使, 胜选]

minhash:
  permutations: 128
  shingle: 5              # character 5-grams of normalised title + snippet
  bands: 32               # 32 bands x 4 rows -> candidate S-curve threshold ~0.42

clustering:
  index_window_h: 72      # events with t_end in this window stay in the in-memory index
  text_threshold: 0.5     # tau_text: estimated Jaccard to join on text alone
  overlap_threshold: 0.2  # tau_overlap: shared tokens / smaller token set (geo path)
  # a join on the shared place alone (no shared title word: e.g. across languages) is only
  # allowed this close in time to the event; otherwise a shared content word is needed too
  place_only_window_h: 6
  # shared tokens needed on the geo path (place counts as one token). Spatially specific
  # categories may join on the place alone; statement-type categories need more evidence.
  min_shared_tokens:
    default: 2
    armed_conflict: 1
    air_activity: 1
    maritime_security: 1
    disaster: 1
    infrastructure: 1
    civil_unrest: 1
  max_signatures: 8       # MinHash signatures kept per event for text matching
  max_tokens: 64          # overlap tokens kept per event
  # time window around [t_start, t_end] in which a document may still join (hours)
  time_window_h:
    default: 24
    armed_conflict: 12
    air_activity: 12
    maritime_security: 24
    civil_unrest: 24
    disaster: 48
    infrastructure: 24
    political: 48
    economic: 48
    cyber_outage: 24

gdelt:
  # CAMEO root codes we track; others are rejected as irrelevant_category
  tracked_roots: ["13", "14", "15", "16", "17", "18", "19", "20"]
  # event codes tracked even under an untracked root (prefix match)
  tracked_codes: ["0233", "0234", "073", "163", "176"]
  min_mentions: 3          # below this, a row with no other source is rejected (low_mentions)
  stale_h: 24              # DATEADDED older than this -> stale
  stale_event_days: 7      # SQLDATE (event date) older than this -> stale

status:
  multi_source_min_domains: 2   # independent outlets (distinct URL domains)

confidence:
  # confidence = sum(weight * component), each component in 0..1; weights sum to 1
  weights:
    source_diversity: 0.35   # 1 - 0.5^(domains - 1): 1 outlet 0, 2 -> 0.5, 3 -> 0.75
    geo: 0.20                # precision score x geo confidence
    relevance: 0.25          # best triage relevance among the event's documents
    recency: 0.10            # 0.5^(hours since t_end / recency_half_life_h)
    gdelt: 0.10              # 1 if a GDELT row was accepted onto the event
  precision_score: {point: 1.0, city: 1.0, admin1: 0.6, country: 0.2}
  recency_half_life_h: 24
