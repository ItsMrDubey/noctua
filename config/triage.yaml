# Free local triage: multilingual keyword lexicons per category (spec §3 taxonomy).
#
# Term syntax (matched on case-folded, accent-stripped text; Arabic letter variants folded):
#   word        whole-word match ("strike" does not match "striker")
#   word*       prefix match ("airstrike*" matches "airstrikes"; use for inflected languages)
#   a b         multi-word phrase (any whitespace between words)
#   Arabic-script terms also match with a leading clitic (و ف ب ل ك ال ...).
#   CJK terms match as substrings (no word boundaries).
# Matching is language-independent: every language's terms are tried on every document,
# so a wrong language guess cannot hide a hit.
#
# Scoring per category: raw = sum(strong) + weak_weight * sum(weak) - negative_weight *
# sum(negative), each distinct term weighted 1.0 in the title and snippet_weight in the
# snippet only; score = 1 - exp(-raw). Off-topic context (sports, entertainment)
# multiplies every score by off_topic_penalty.

threshold: 0.35          # category score needed to tag a document with the category
relevant: 0.35           # relevance needed to count a document as relevant (metrics)
weak_weight: 0.35
negative_weight: 0.7
snippet_weight: 0.6
place_bonus: 0.05        # added to relevance when a confident place is found
off_topic_penalty: 0.25
off_topic_trigger: 1.0   # off-topic score (strong=1, weak=0.5) that triggers the penalty

# Phrases removed before scoring (idioms and look-alikes of conflict vocabulary).
mask:
  - hunger strike*
  - strike a deal
  - strike a balance
