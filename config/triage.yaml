# CAMEO root code (GDELT EventRootCode) -> our category. Event-code overrides win.
cameo_roots:
  "01": political    # make public statement
  "02": political    # appeal
  "03": political    # express intent to cooperate
  "04": political    # consult
  "05": political    # diplomatic cooperation
  "06": economic     # material cooperation
  "07": economic     # provide aid
  "08": political    # yield
  "09": political    # investigate
  "10": political    # demand
  "11": political    # disapprove
  "12": political    # reject
  "13": political    # threaten
  "14": civil_unrest # protest
  "15": armed_conflict # exhibit force posture
  "16": political    # reduce relations
  "17": civil_unrest # coerce (arrests, repression)
  "18": armed_conflict # assault
  "19": armed_conflict # fight
  "20": armed_conflict # unconventional mass violence
cameo_overrides:
  "138": armed_conflict   # threaten with military force
  "1381": armed_conflict
  "1382": armed_conflict
  "1383": armed_conflict
  "1384": armed_conflict
  "1385": armed_conflict
  "163": economic         # impose embargo, boycott, sanctions
  "1621": economic        # reduce or stop economic assistance
  "176": cyber_outage     # attack cybernetically
  "0233": disaster        # appeal for humanitarian aid
  "0234": disaster        # appeal for military protection or peacekeeping
  "073": disaster         # provide humanitarian aid
  "0874": armed_conflict  # retreat or surrender militarily
  "192": armed_conflict   # occupy territory
  "195": armed_conflict   # employ aerial weapons
# relevance of a GDELT row by QuadClass (1 verbal coop, 2 material coop, 3 verbal
# conflict, 4 material conflict) before the article-count bonus
gdelt_quad_relevance:
  "1": 0.15
  "2": 0.2
  "3": 0.35
  "4": 0.6
