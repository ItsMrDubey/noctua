  iswap: "NG"
  is_sahel: "ML"
  is_somalia: "SO"
  is_mozambique: "MZ"
  is_drc_adf: "CD"
  is_sinai: "EG"
  is_libya: "LY"
  is_philippines: "PH"
  is_bangladesh: "BD"
  aqap: "YE"
  aqim: "DZ"
  jnim: "ML"
  alshabaab: "SO"
  hurras_al_din: "SY"
  hts: "SY"
  boko_haram: "NG"
  ansaru: "NG"
  ttp: "PK"
  taliban: {country: "AF", class: state_government}
  haqqani: "AF"
  let: "PK"
  trf: "IN"
  jem: "PK"
  bla: "PK"
  hamas: "PS"
  pij: "PS"
  pflp: "PS"
