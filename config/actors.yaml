  houthis: "YE"
  kataib_hezbollah: "IQ"
  aah: "IQ"
  nujaba: "IQ"
  pkk: "TR"
  tak: "TR"
  dhkpc: "TR"
  eln: "CO"
  farc_dissidents: "CO"
  shining_path: "PE"
  npa: "PH"
