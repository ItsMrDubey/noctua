  category_url: https://news.usni.org/category/fleet-tracker
  min_interval_h: 12
  prior_weight: 0.4
  prior_radius_km: 700
  prior_half_life_h: 96
  candidate_max_km: 1500
  # region / port name (lower case, without leading "the") -> [lat, lon]; coarse centroids
