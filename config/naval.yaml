# Carrier strike group activity inference (osint.naval).
# Outputs are probabilistic hypotheses from public signals, never confirmed positions.
job:
  interval_s: 600          # CarrierJob cadence
  initial_delay_s: 90      # first pass after boot (keeps short-lived test runtimes offline)
  hours: 48                # default fusion window
  # sliding windows longer than this are refused by the API
  max_hours: 168

geo:
  open_ocean_km: 80        # sea-terminating legs: > this from coast AND from any airport
  far_from_land_km: 150    # carrier-air-wing types / orbits: > this from land
  open_water_km: 40        # support-ship loiter: > this from land

flights:
  max_gap_min: 20          # a gap longer than this splits a track into legs
  low_alt_ft: 1500         # "descend below" threshold
  slow_kts: 200            # and slower than this
  appear_alt_ft: 3000      # first/last report at or below this counts as appear/disappear low
  min_points: 2
  live_grace_min: 20       # a leg whose last report is this recent may still be airborne
  base_weight: 1.0
  sample_min: 30           # cvw_aircraft: at most one evidence per track per this many minutes
  cvw_weight: 0.6

# ICAO type code -> multiplier for carrier-associated aircraft
carrier_types:
  C2: 3.0       # C-2A Greyhound (COD) - note ICAO C2 is also the Kawasaki C-2
  V22: 2.5      # MV-22 / CMV-22B
  E2: 3.0       # E-2C/D Hawkeye
  H60: 2.0      # MH-60R/S
  F18S: 2.5     # F/A-18E/F
  F18H: 2.0     # F/A-18 legacy
  E18G: 3.0     # EA-18G Growler (some feeds)
  EA18: 3.0
  F35: 1.5      # F-35 (C variant not distinguishable by ICAO type)
  RAFL: 1.5     # Rafale M (Charles de Gaulle)
  SU33: 2.5     # Su-33 (Kuznetsov)
  J15: 2.5
  MIG29: 1.0
  EH10: 1.5     # Merlin (QE class)
  NH90: 1.0
  KA27: 2.0

orbits:
  min_turn_deg: 540        # cumulative heading change within one leg
  max_radius_km: 120
  min_duration_min: 30
  types:                   # tanker / ISR types weigh more
    K35R: 1.5
    KC46: 1.5
    KC10: 1.5
    P8: 1.5
    P3: 1.2
    E3CF: 1.2
    E3TF: 1.2
    R135: 1.2
    Q4: 1.5
    MQ4C: 1.5
    E2: 2.0
  default_weight: 0.6

ships:
  loiter_hours: 12
  max_speed_kts: 12
  max_radius_km: 60
  min_points: 3
  named_weight: 2.5
  military_type_weight: 1.0
  # AIS names of US/allied fleet support ships (USNS prefix is also matched on its own)
  name_patterns:
    - "^USNS\\b"
    - "\\bT-?AO\\b"
    - "\\bT-?AKE\\b"
    - "\\bT-?AOE\\b"
    - "\\bRFA\\b"
  # exact AIS name match (after stripping USNS/RFA): Henry J. Kaiser / John Lewis class oilers, Lewis and Clark class, RFA Tide class
  support_names:
    - JOHN LEWIS
    - HARVEY MILK
    - EARL WARREN
    - ROBERT F KENNEDY
    - LUCY STONE
    - SOJOURNER TRUTH
    - HENRY J KAISER
    - JOHN ERICSSON
    - WALTER S DIEHL
    - JOHN LENTHALL
    - LEROY GRUMMAN
    - KANAWHA
    - LARAMIE
    - BIG HORN
    - TIPPECANOE
    - GUADALUPE
    - PECOS
    - RAPPAHANNOCK
    - YUKON
    - LEWIS AND CLARK
    - SACAGAWEA
    - ALAN SHEPARD
    - RICHARD E BYRD
    - ROBERT E PEARY
    - AMELIA EARHART
    - CARL BRASHEAR
    - WALLY SCHIRRA
    - MATTHEW PERRY
    - CHARLES DREW
    - WASHINGTON CHAMBERS
    - WILLIAM MCLEAN
    - MEDGAR EVERS
    - CESAR CHAVEZ
    - TIDESPRING
    - TIDESURGE
    - TIDEFORCE
    - TIDERACE

nav_warnings:
  lookback_days: 45
  strong_keywords: [CARRIER, FLIGHT OPERATIONS, AIRCRAFT OPERATIONS]
  medium_keywords: [NAVAL EXERCISE, NAVAL EXERCISES, GUNNERY, MISSILE FIRING, ROCKET FIRING,
                    HAZARDOUS OPERATIONS, LIVE FIRING, MILITARY EXERCISES]
  strong_weight: 2.5
  medium_weight: 1.0
  max_radius_km: 400       # very large warning areas are spread, not ignored
  min_open_ocean_km: 30    # warnings entirely hugging a coast are skipped

voids:
  baseline_days: 14
  bin_hours: 6
  recent_bins: [1, 2, 4]   # 6, 12, 24 h
  min_baseline_mean: 3.0   # distinct vessels per 6 h bin
  min_baseline_bins: 12
  max_p: 0.001            # per cell and window (many cells are tested: keep it strict)
  max_ratio: 0.35
  min_global_ratio: 0.5    # skip everything when overall AIS volume collapsed (feed outage)
  weight: 1.0
  baseline_refresh_h: 6
  diversion_bend_deg: 25
  diversion_min_tracks: 3
  diversion_min_fraction: 0.4
  diversion_weight: 0.8

news:
  lookback_hours: 72
  weight: 0.3
  radius_km: 600
  generic_terms: ["carrier strike group", "amphibious ready group", "aircraft carrier", "\\bCSG\\b"]
  # name -> aliases; context=true requires a carrier word nearby (names that are also places)
  carriers:
    - {name: USS Gerald R. Ford, aliases: ["Gerald R. Ford", "Gerald Ford", "CVN-78", "CVN 78"]}
    - {name: USS Dwight D. Eisenhower, aliases: ["Dwight D. Eisenhower", "USS Eisenhower", "CVN-69", "CVN 69"]}
    - {name: USS Carl Vinson, aliases: ["Carl Vinson", "CVN-70", "CVN 70"]}
    - {name: USS Theodore Roosevelt, aliases: ["USS Theodore Roosevelt", "CVN-71", "CVN 71"]}
    - {name: USS Abraham Lincoln, aliases: ["USS Abraham Lincoln", "CVN-72", "CVN 72"]}
    - {name: USS George Washington, aliases: ["USS George Washington", "CVN-73", "CVN 73"]}
    - {name: USS John C. Stennis, aliases: ["John C. Stennis", "USS Stennis", "CVN-74", "CVN 74"]}
    - {name: USS Harry S. Truman, aliases: ["Harry S. Truman", "USS Truman", "CVN-75", "CVN 75"]}
    - {name: USS Ronald Reagan, aliases: ["USS Ronald Reagan", "CVN-76", "CVN 76"]}
    - {name: USS George H.W. Bush, aliases: ["George H.W. Bush", "George H. W. Bush", "George HW Bush", "CVN-77", "CVN 77"]}
    - {name: USS Nimitz, aliases: ["USS Nimitz", "CVN-68", "CVN 68"]}
    - {name: HMS Queen Elizabeth, aliases: ["HMS Queen Elizabeth"]}
    - {name: HMS Prince of Wales, aliases: ["HMS Prince of Wales"]}
    - {name: Charles de Gaulle, aliases: ["Charles de Gaulle", "Charles-de-Gaulle"], context: true}
    - {name: INS Vikrant, aliases: ["INS Vikrant"]}
    - {name: INS Vikramaditya, aliases: ["INS Vikramaditya", "Vikramaditya"]}
    - {name: Liaoning, aliases: ["Liaoning"], context: true}
    - {name: Shandong, aliases: ["Shandong"], context: true}
    - {name: Fujian, aliases: ["Fujian"], context: true}
    - {name: ITS Cavour, aliases: ["ITS Cavour", "Cavour"], context: true}
    - {name: ITS Trieste, aliases: ["ITS Trieste", "Trieste"], context: true}
    - {name: Juan Carlos I, aliases: ["Juan Carlos I"], context: true}
    - {name: Admiral Kuznetsov, aliases: ["Admiral Kuznetsov", "Admiral Kuznetsov carrier"]}
    - {name: JS Kaga, aliases: ["JS Kaga"], context: false}
    - {name: JS Izumo, aliases: ["JS Izumo"], context: false}
  context_pattern: "carrier|flattop|strike group|warship|navy|naval|aircraft carrier|航母|авианос"

usni:
