# Carrier strike group activity inference (osint.naval).
# Outputs are probabilistic hypotheses from public signals, never confirmed positions.
job:
  interval_s: 600          # CarrierJob cadence
  initial_delay_s: 90      # first pass after boot (keeps short-lived test runtimes offline)
  hours: 48                # default fusion window
  # sliding windows longer than this are refused by the API
  max_hours: 168

geo:
  open_ocean_km: 80        # sea-terminating legs: > this from coast AND from any airport
  far_from_land_km: 150    # carrier-air-wing types / orbits: > this from land
  open_water_km: 40        # support-ship loiter: > this from land

flights:
  max_gap_min: 20          # a gap longer than this splits a track into legs
  low_alt_ft: 1500         # "descend below" threshold
  slow_kts: 200            # and slower than this
  appear_alt_ft: 3000      # first/last report at or below this counts as appear/disappear low
  min_points: 2
  live_grace_min: 20       # a leg whose last report is this recent may still be airborne
  base_weight: 1.0
  sample_min: 30           # cvw_aircraft: at most one evidence per track per this many minutes
  cvw_weight: 0.6
  # unlisted military types (no carrier_types entry): share of base_weight. 0 = ignored; the
  # 2026-11 live false positives were an AW139 near Malta and an E170 0 ft / 0 kt glitch
  generic_weight_factor: 0.0
  platform_km: 25          # skip ends within this of an offshore flare site (platform proxy)

# ICAO type code -> multiplier for carrier-associated aircraft
carrier_types:
  C2: 3.0       # C-2A Greyhound (COD) - note ICAO C2 is also the Kawasaki C-2
  V22: 2.5      # MV-22 / CMV-22B
  E2: 3.0       # E-2C/D Hawkeye
  H60: 2.0      # MH-60R/S
  F18S: 2.5     # F/A-18E/F
  F18H: 2.0     # F/A-18 legacy
  E18G: 3.0     # EA-18G Growler (some feeds)
  EA18: 3.0
  F35: 1.5      # F-35 (C variant not distinguishable by ICAO type)
  RAFL: 1.5     # Rafale M (Charles de Gaulle)
  SU33: 2.5     # Su-33 (Kuznetsov)
  J15: 2.5
  MIG29: 1.0
  EH10: 1.5     # Merlin (QE class)
  NH90: 1.0
  KA27: 2.0
  MIG29K: 2.0   # MiG-29K (Vikramaditya / Vikrant), when feeds use the variant code

# ------------------------------------------------------------------ carrier aircraft model
# Per-leg launch / recovery / helicopter-loiter signatures ("air fixes") -> moving-point fit
# (osint.naval.airfix / osint.naval.trackfit). Everything here is evidence for a hypothesis,
# never a position.
aircraft:
  lookback_h: 168            # air history read for fixes + track fits (fusion still decays it)
  open_ocean_km: 80          # a fix must be > this from land AND from any airfield/heliport
  low_alt_ft: 1500
  slow_kts: 220
  appear_alt_ft: 2500        # first/last report at or below this = launch/recovery height
  climb_fpm: 300             # mean climb (launch) / descent (recovery) rate over the edge
  edge_points: 4             # reports inspected at each end of a leg
  min_speed_fixed_kts: 60    # fixed-wing reports slower than this at 0 ft are ground glitches
  max_speed_kts: 650         # faster than this between reports = position glitch
  platform_km: 25            # helicopter fixes within this of an offshore flare site (oil/gas
                             # platform proxy, data/reference/eog_flares.json) are discarded
  training_coast_km: 200     # fighter legs from a land airfield ending within this of the
                             # coast are down-weighted (training range sortie, not a recovery)
  training_factor: 0.35
  generic_weight: 0.0        # unlisted military types: 0 = never a fix (were half weight; the
                             # live false positives were AW139 / E170 records)
  loiter:                    # helicopters circling a (slowly moving) point far from land
    types: [H60, EH10, NH90, KA27, AS65, LYNX, WILD]
    min_minutes: 30
    max_radius_km: 45
    max_alt_ft: 3000
    max_drift_kts: 35        # centroid drift between halves (a carrier makes <= ~32 kt)
  signature_factor: {recovery: 1.0, launch: 1.0, loiter: 0.8, launch_recovery: 1.2}
  # Hexes of the JASDF Kawasaki C-2 (same ICAO type code C2 as the C-2A Greyhound, which
  # retired from US service in 2026) - Japan's 24-bit block 0x840000-0x87FFFF.
  type_hex_exclude:
    C2: [["840000", "87ffff"]]
  type_labels:
    C2: C-2A Greyhound (COD)
    V22: V-22 / CMV-22B Osprey
    E2: E-2C/D Hawkeye
    H60: MH-60R/S Seahawk
    F18S: F/A-18E/F Super Hornet
    F18H: F/A-18 Hornet
    E18G: EA-18G Growler
    EA18: EA-18G Growler
    F35: F-35
    RAFL: Rafale M
    EH10: Merlin HM2
    NH90: NH90 NFH
    KA27: Ka-27/31
    SU33: Su-33
    J15: J-15
    MIG29: MiG-29K
    MIG29K: MiG-29K
    P8: P-8 Poseidon
    P1: Kawasaki P-1
    ATLA: Atlantique 2
    ATL2: Atlantique 2
    Q4: MQ-4C / RQ-4
    MQ4C: MQ-4C Triton
    K35R: KC-135
    KC46: KC-46
  fighter_types: [F18S, F18H, E18G, EA18, F35, RAFL, SU33, J15, MIG29, MIG29K]
  # Maritime patrol / ISR / tankers are land based: supporting evidence (orbits), never a fix.
  # military-only ICAO types (no civil look-alikes: A332 = also every civil A330-200, so the
  # KC-30 / MRTT is left to the military feed)
  support_types: [P8, P3, P1, ATLA, ATL2, Q4, MQ4C, K35R, KC46, KC10]
  # Callsign patterns (regex on the ADS-B flight field, upper case) with labels. Seed ONLY
  # well-documented ones; add your own (they also drive adsb_naval's capture of aircraft that
  # are not flagged military). weight replaces the type multiplier when higher.
  callsigns:
    # VRC-40 "Rawhides" (NS Norfolk) - Carrier Onboard Delivery for 2nd/5th/6th Fleet; flights
    # use "RAWHIDE nn" (e.g. "Rawhide 78" on a COD resupply run, Smithsonian Air & Space,
    # https://www.smithsonianmag.com/air-space-magazine/greyhound-and-osprey-180973131/;
    # squadron: https://en.wikipedia.org/wiki/VRC-40). The C-2A retired in 2026 (DVIDS
    # 571056); whether the CMV-22B successor keeps RAWHIDE is unverified, so the type is not
    # assumed.
    - {pattern: '^RAWHIDE ?\d{0,3}$', label: "VRC-40 'Rawhides' carrier onboard delivery", role: cod, weight: 3.0}
    # Deliberately NOT seeded (could not verify from a citable source): VRC-30 / VRM-30 / VRM-50
    # COD callsigns, HSC/HSM and CVW squadron tactical callsigns, foreign naval air arms.
    # The ICAO designator CNV / "CONVOY" is US Navy *logistics* (land-based C-40/C-130
    # airlift), not carrier aviation - not a carrier signal.

# moving-point fit of air fixes (osint.naval.trackfit)
trackfit:
  max_speed_kts: 32          # carrier upper bound
  pos_tol_km: 40             # a fix's own spread (aircraft within the pattern / last report)
  inlier_km: 45              # RANSAC inlier residual
  max_link_h: 36             # fixes further apart in time are not linked into one group
  min_span_h: 1.0            # below this time span velocity is unknown (stationary model)
  sigma_floor_km: 15
  drift_kmh: 10              # manoeuvre growth of the ellipse per hour since the last fix
  unknown_speed_kts: 16      # 1-sigma speed when the velocity cannot be fitted
  ellipse_k: 2.4477          # 95 % ellipse scale (chi-square 2 dof)
  max_axis_km: 1500
  min_fixes_evidence: 1      # a fit needs >= this many fixes to become 'air_track' evidence
  single_fix_factor: 0.5     # weight share of a one-fix "fit" (no motion information)
  weight: 1.5                # air_track base weight, x (1 + 0.5 x (aircraft - 1)), capped
  max_weight: 4.0

orbits:
  min_turn_deg: 540        # cumulative heading change within one leg
  max_radius_km: 120
  min_duration_min: 30
  types:                   # tanker / ISR types weigh more
    K35R: 1.5
    KC46: 1.5
    KC10: 1.5
    P8: 1.5
    P3: 1.2
    E3CF: 1.2
    E3TF: 1.2
    R135: 1.2
    Q4: 1.5
    MQ4C: 1.5
    E2: 2.0
  default_weight: 0.6

ships:
  loiter_hours: 12
  max_speed_kts: 12
  max_radius_km: 60
  min_points: 3
  named_weight: 2.5
  military_type_weight: 1.0
  # AIS names of US/allied fleet support ships (USNS prefix is also matched on its own)
  name_patterns:
    - "^USNS\\b"
    - "\\bT-?AO\\b"
    - "\\bT-?AKE\\b"
    - "\\bT-?AOE\\b"
    - "\\bRFA\\b"
  # exact AIS name match (after stripping USNS/RFA): Henry J. Kaiser / John Lewis class oilers, Lewis and Clark class, RFA Tide class
  support_names:
    - JOHN LEWIS
    - HARVEY MILK
    - EARL WARREN
    - ROBERT F KENNEDY
    - LUCY STONE
    - SOJOURNER TRUTH
    - HENRY J KAISER
    - JOHN ERICSSON
    - WALTER S DIEHL
    - JOHN LENTHALL
    - LEROY GRUMMAN
    - KANAWHA
    - LARAMIE
    - BIG HORN
    - TIPPECANOE
    - GUADALUPE
    - PECOS
    - RAPPAHANNOCK
    - YUKON
    - LEWIS AND CLARK
    - SACAGAWEA
    - ALAN SHEPARD
    - RICHARD E BYRD
    - ROBERT E PEARY
    - AMELIA EARHART
    - CARL BRASHEAR
    - WALLY SCHIRRA
    - MATTHEW PERRY
    - CHARLES DREW
    - WASHINGTON CHAMBERS
    - WILLIAM MCLEAN
    - MEDGAR EVERS
    - CESAR CHAVEZ
    - TIDESPRING
    - TIDESURGE
    - TIDEFORCE
    - TIDERACE

nav_warnings:
  lookback_days: 45
  strong_keywords: [CARRIER, FLIGHT OPERATIONS, AIRCRAFT OPERATIONS]
  medium_keywords: [NAVAL EXERCISE, NAVAL EXERCISES, GUNNERY, MISSILE FIRING, ROCKET FIRING,
                    HAZARDOUS OPERATIONS, LIVE FIRING, MILITARY EXERCISES]
  strong_weight: 2.5
  medium_weight: 1.0
  max_radius_km: 400       # very large warning areas are spread, not ignored
  min_open_ocean_km: 30    # warnings entirely hugging a coast are skipped

voids:
  baseline_days: 14
  bin_hours: 6
  recent_bins: [1, 2, 4]   # 6, 12, 24 h
  min_baseline_mean: 3.0   # distinct vessels per 6 h bin
  min_baseline_bins: 12
  max_p: 0.001            # per cell and window (many cells are tested: keep it strict)
  max_ratio: 0.35
  min_global_ratio: 0.5    # skip everything when overall AIS volume collapsed (feed outage)
  weight: 1.0
  baseline_refresh_h: 6
  diversion_bend_deg: 25
  diversion_min_tracks: 3
  diversion_min_fraction: 0.4
  diversion_weight: 0.8

news:
  lookback_hours: 72
  weight: 0.3
  radius_km: 600
  generic_terms: ["carrier strike group", "amphibious ready group", "aircraft carrier", "\\bCSG\\b"]
  # name -> aliases; context=true requires a carrier word nearby (names that are also places)
  carriers:
    - {name: USS Gerald R. Ford, aliases: ["Gerald R. Ford", "Gerald Ford", "CVN-78", "CVN 78"]}
    - {name: USS Dwight D. Eisenhower, aliases: ["Dwight D. Eisenhower", "USS Eisenhower", "CVN-69", "CVN 69"]}
    - {name: USS Carl Vinson, aliases: ["Carl Vinson", "CVN-70", "CVN 70"]}
    - {name: USS Theodore Roosevelt, aliases: ["USS Theodore Roosevelt", "CVN-71", "CVN 71"]}
    - {name: USS Abraham Lincoln, aliases: ["USS Abraham Lincoln", "CVN-72", "CVN 72"]}
    - {name: USS George Washington, aliases: ["USS George Washington", "CVN-73", "CVN 73"]}
    - {name: USS John C. Stennis, aliases: ["John C. Stennis", "USS Stennis", "CVN-74", "CVN 74"]}
    - {name: USS Harry S. Truman, aliases: ["Harry S. Truman", "USS Truman", "CVN-75", "CVN 75"]}
    - {name: USS Ronald Reagan, aliases: ["USS Ronald Reagan", "CVN-76", "CVN 76"]}
    - {name: USS George H.W. Bush, aliases: ["George H.W. Bush", "George H. W. Bush", "George HW Bush", "CVN-77", "CVN 77"]}
    - {name: USS Nimitz, aliases: ["USS Nimitz", "CVN-68", "CVN 68"]}
    - {name: HMS Queen Elizabeth, aliases: ["HMS Queen Elizabeth"]}
    - {name: HMS Prince of Wales, aliases: ["HMS Prince of Wales"]}
    - {name: Charles de Gaulle, aliases: ["Charles de Gaulle", "Charles-de-Gaulle"], context: true}
    - {name: INS Vikrant, aliases: ["INS Vikrant"]}
    - {name: INS Vikramaditya, aliases: ["INS Vikramaditya", "Vikramaditya"]}
    - {name: Liaoning, aliases: ["Liaoning"], context: true}
    - {name: Shandong, aliases: ["Shandong"], context: true}
    - {name: Fujian, aliases: ["Fujian"], context: true}
    - {name: ITS Cavour, aliases: ["ITS Cavour", "Cavour"], context: true}
    - {name: ITS Trieste, aliases: ["ITS Trieste", "Trieste"], context: true}
    - {name: Juan Carlos I, aliases: ["Juan Carlos I"], context: true}
    - {name: Admiral Kuznetsov, aliases: ["Admiral Kuznetsov", "Admiral Kuznetsov carrier"]}
    - {name: JS Kaga, aliases: ["JS Kaga"], context: false}
    - {name: JS Izumo, aliases: ["JS Izumo"], context: false}
  context_pattern: "carrier|flattop|strike group|warship|navy|naval|aircraft carrier|航母|авианос"

