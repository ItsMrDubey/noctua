fusion:
  half_life_h: 12
  bandwidth_km: 75
  min_cell_density: 0.25     # absolute (time-decayed weight per cell) for hypothesis cells
  eps_km: 250
  min_radius_km: 50
  max_evidence: 15
  # positional indicator kinds; news + usni_prior only name/prior and never count as independent
  positional_kinds: [sea_terminating_flight, cvw_aircraft, support_ship, nav_warning, traffic_void,
                     traffic_diversion, orbit, support_orbit, air_track]
  kind_scale:                # saturation scale of each kind's summed weight
    sea_terminating_flight: 2.0
    cvw_aircraft: 3.0
    support_ship: 2.0
    nav_warning: 2.5
    traffic_void: 1.5
    traffic_diversion: 1.5
    orbit: 2.0
    support_orbit: 2.0
    air_track: 2.5
  kind_strength:             # max contribution of a kind (strong ~1, medium ~0.6)
    sea_terminating_flight: 1.0
    cvw_aircraft: 0.7
    support_ship: 1.0
    nav_warning: 0.9
    traffic_void: 0.6
    traffic_diversion: 0.5
    orbit: 0.5
    support_orbit: 0.3
    air_track: 0.9
    news: 0.15
    usni_prior: 0.15
  single_kind_cap: 0.45      # < 2 independent positional kinds can never exceed this
  # kinds whose sources are all behind a stronger kind (the same flights) add only this share
  # of their strength (one C-2 flight = sea_terminating + cvw + air_track is ONE signal)
  shadowed_factor: 0.25
  # aircraft-only hypotheses: the cap rises to this when one moving-point fit holds >= N
  # distinct aircraft of >= 2 types (several independent flights agreeing on one moving point)
  air_multi_cap: 0.6
  # kinds of one family count as ONE kind for the 2-independent-kinds rule (different flights
  # are independent sources, but aircraft alone are one modality: a second modality - ships,
  # warnings, traffic - is needed to pass the caps above)
  families:
    aircraft: [sea_terminating_flight, cvw_aircraft, orbit, support_orbit, air_track]
  # orbits of land-based tankers / maritime patrol / ISR (not carrier types) only SUPPORT a
  # hypothesis; on their own they never make one
  supporting_kinds: [support_orbit]
  air_multi_min_aircraft: 3
  max_confidence: 0.95
  match_km: 300              # hypothesis identity across runs
  match_hours: 24
