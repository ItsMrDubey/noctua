# Terror Watch groups knowledge base (osint.terror.groups).
#
# What is curated here: identity only -- canonical name, multilingual aliases, family
# (parent/affiliate), ideological category and the actor names UCDP uses for the group.
# What is NOT curated here: designation status (always read from the official lists:
# US FTO / OFAC SDGT, UN 1267/1988, UK proscription, EU terrorist list -- see
# /api/terror/designations), areas of operation and activity tempo (derived from incident
# data). Groups on an official list that are not below get an automatic entry.
#
# aliases:      matched case/diacritic-insensitively as whole words in a perpetrator /
#               claim quote (never by similarity).
# weak_aliases: too ambiguous for free text ("IS", "AQ", "HM"); they only link when they
#               are the entire perpetrator name the extraction returned.
# category:     jihadist | shia_militant | palestinian_militant | ethno_separatist |
#               left_wing | right_wing_dve | anarchist | nihilist_dve | other_political |
#               criminal (cartels / gangs; designated by some states but their violence
#               is not terrorism under the working definition unless criteria are met)
# conflict_party: the group is a party to an ongoing armed conflict; its attacks inside that
#               conflict are warfare / insurgency unless civilians are deliberately targeted.
# ucdp_actors:  UCDP side_a names whose one-sided violence is attributed to this group
#               (historical base rates).

