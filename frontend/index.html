<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSINT // Global Picture</title>
<link rel="stylesheet" href="/static/vendor/cesium/Widgets/widgets.css">
<link rel="stylesheet" href="/static/style.css">
<script>window.CESIUM_BASE_URL = "/static/vendor/cesium/";</script>
<script src="/static/vendor/cesium/Cesium.js"></script>
</head>
<body>
<div id="globe"></div>

<header id="topbar" class="panel">
  <div class="brand">OSINT <span>//</span> Global Picture</div>
  <div id="sources" class="sources"></div>
  <div id="counts" class="counts"></div>
  <div class="search">
    <input id="search" type="search" placeholder="Search name / id / type / operator" autocomplete="off">
    <div id="results" class="results hidden"></div>
  </div>
  <div id="clock" class="clock">--:--:-- UTC</div>
</header>

<aside id="left" class="panel">
  <h3>Layers</h3>
  <label class="row"><input type="checkbox" id="t-aircraft" checked><span class="sw" style="--c:#ff9a1f"></span>Military aircraft<b id="c-aircraft">–</b></label>
  <label class="row sub"><input type="checkbox" id="t-aircraft-hp"><span class="sw" style="--c:#ff3b3b"></span>High-priority only</label>
  <label class="row"><input type="checkbox" id="t-ships" checked><span class="sw" style="--c:#2fd8ff"></span>Ships<b id="c-ships">–</b></label>
  <label class="row sub"><input type="checkbox" id="t-ships-mil"><span class="sw" style="--c:#ff3b3b"></span>Military ships only</label>
  <label class="row"><input type="checkbox" id="t-fires" checked><span class="sw" style="--c:#ff6a00"></span>Fires 24 h<b id="c-fires">–</b></label>
  <label class="row"><input type="checkbox" id="t-quakes" checked><span class="sw" style="--c:#ffe14a"></span>Quakes 24 h<b id="c-quakes">–</b></label>
  <h3>Reference</h3>
  <label class="row"><input type="checkbox" id="r-airports" checked><span class="sw sq" style="--c:#36c5ff"></span>Airports</label>
  <label class="row sub"><input type="checkbox" id="r-airports-med"><span class="sw sq" style="--c:#36c5ff"></span>Include medium</label>
  <label class="row sub"><input type="checkbox" id="r-airports-mil"><span class="sw sq" style="--c:#ff4d4d"></span>Military only</label>
  <label class="row"><input type="checkbox" id="r-runways"><span class="sw sq" style="--c:#36c5ff"></span>Runways (zoom &lt; 400 km)</label>
  <label class="row"><input type="checkbox" id="r-ports"><span class="sw sq" style="--c:#3ddcc2"></span>Seaports</label>
  <label class="row"><input type="checkbox" id="r-bases" checked><span class="sw dm" style="--c:#ff5a5a"></span>Military bases</label>
  <div id="r-chips" class="chips"></div>
  <label class="row sub"><input type="checkbox" id="r-rings"><span class="sw" style="--c:#ff5a5a"></span>Range rings 100/300/500 km</label>
  <label class="row"><input type="checkbox" id="r-borders" checked><span class="sw ln" style="--c:#36c5ff"></span>Country borders</label>
  <label class="row"><input type="checkbox" id="r-disputed"><span class="sw ln" style="--c:#ffb020"></span>Disputed boundaries</label>
  <label class="row"><input type="checkbox" id="r-maritime"><span class="sw ln" style="--c:#3ddcc2"></span>Maritime lines</label>
  <label class="row"><input type="checkbox" id="r-choke" checked><span class="sw sq" style="--c:#ffb020"></span>Chokepoints</label>
  <label class="row"><input type="checkbox" id="r-clabels"><span class="sw" style="--c:#36c5ff"></span>Country labels</label>
  <h3>Trails</h3>
  <label class="row"><input type="checkbox" id="t-miltrails"><span class="sw" style="--c:#ff9a1f"></span>Show trails for all military aircraft (last 1 h)</label>
  <h3>Density (H3)</h3>
  <label class="row"><input type="checkbox" id="d-aircraft"><span class="sw" style="--c:#21918c"></span>Aircraft</label>
  <label class="row"><input type="checkbox" id="d-ships"><span class="sw" style="--c:#21918c"></span>Ships</label>
  <label class="row"><input type="checkbox" id="d-fires"><span class="sw" style="--c:#21918c"></span>Fires</label>
  <label class="row"><input type="checkbox" id="d-quakes"><span class="sw" style="--c:#21918c"></span>Quakes</label>
  <label class="row date">Resolution <select id="d-res"><option value="3">3 (coarse)</option><option value="4">4</option><option value="5">5 (fine)</option></select></label>
  <h3>Imagery</h3>
  <label class="row"><input type="checkbox" id="t-labels"><span class="sw" style="--c:#aaa"></span>Labels overlay</label>
  <label class="row"><input type="checkbox" id="t-viirs"><span class="sw" style="--c:#6aa8ff"></span>NASA VIIRS true colour</label>
  <label class="row"><input type="checkbox" id="t-night"><span class="sw" style="--c:#c9a7ff"></span>NASA night lights</label>
  <label class="row date">GIBS date <input type="date" id="gibs-date"></label>
</aside>

<aside id="right" class="panel hidden">
  <button id="close-details" class="close" title="Close">&times;</button>
  <h3 id="d-title">Details</h3>
  <div id="d-body"></div>
  <div class="actions">
    <button id="d-fly">Fly to</button>
    <button id="d-follow" class="hidden">Follow: off</button>
  </div>
</aside>

<aside id="tracks" class="panel">
  <div class="tk-head"><b>Tracks</b> <span id="tracks-count"></span>
    <span class="tabs"><button class="tab on" data-tab="aircraft">Aircraft</button><button class="tab" data-tab="ships">Ships</button></span>
    <button id="tl-collapse" title="Collapse">�</button></div>
  <div class="tk-body"><table id="tracks-table"></table></div>
</aside>

<div id="timeline" class="panel">
  <span id="tl-mode" class="mode">LIVE</span>
  <button id="tl-live" class="on">Live</button>
  <button id="tl-play">Play</button>
  <select id="tl-speed"><option value="1">1 min/s</option><option value="10" selected>10 min/s</option><option value="60">1 h/s</option></select>
  <span id="tl-start" class="lbl"></span>
  <input type="range" id="tl-slider" min="0" max="2880" value="2880" step="1">
  <span id="tl-end" class="lbl">now</span>
</div>

<div id="pick-tip" class="panel hidden"></div>

<footer id="attrib" class="panel">Imagery: Esri / NASA GIBS &bull; Data: ADS-B aggregators, AISStream, NASA FIRMS, USGS &bull; Reference: OurAirports, NGA WPI / Natural Earth (public domain)</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
