<!doctype html>
<html><head><meta charset="utf-8"><title>NOCTUA</title>
<style>
  html,body{margin:0;height:100%;background:#03060a;color:#cfe8ff;font:13px/1.5 "Segoe UI",sans-serif;overflow:hidden}
  .wrap{height:100%;display:grid;place-items:center}
  .box{text-align:center}
  .mark{width:96px;height:96px;margin:0 auto 22px;border:3px solid #5ee3ea;border-radius:50%;position:relative;box-shadow:0 0 24px rgba(94,227,234,.25)}
  .eye{position:absolute;top:36px;width:18px;height:18px;border:4px solid #5ee3ea;border-radius:50%}
  .eye::after{content:"";position:absolute;inset:5px;background:#5ee3ea;border-radius:50%}
  .l{left:18px}.r{right:18px}
  h1{font:600 18px/1 "Segoe UI",sans-serif;letter-spacing:.42em;margin:0 0 6px}
  h1 span{color:#5ee3ea}
  .sub{letter-spacing:.3em;font-size:10px;color:#6f8aa0;margin-bottom:26px}
  .bar{width:260px;height:2px;background:#0f2233;margin:0 auto 12px;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#5ee3ea;animation:s 1.4s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #msg{color:#8fb0c6;font-size:12px;min-height:18px}
  #err{color:#ff7b84;font-size:12px;max-width:520px;margin:10px auto 0;white-space:pre-wrap}
</style></head>
<body><div class="wrap"><div class="box">
  <div class="mark"><div class="eye l"></div><div class="eye r"></div></div>
  <h1>NOCTUA <span>//</span></h1><div class="sub">GLOBAL WATCH</div>
  <div class="bar"><i></i></div>
  <div id="msg">Starting backend…</div><div id="err"></div>
</div></div></body></html>
