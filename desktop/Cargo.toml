[package]
name = "noctua-desktop"
version = "0.1.0"
description = "NOCTUA desktop shell: native window + tray around the local OSINT backend"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
