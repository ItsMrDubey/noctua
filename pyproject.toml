[project]
name = "osint"
version = "0.1.0"
description = "Global event intelligence platform (POC)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "websockets>=13",
  "msgspec>=0.18",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "pyarrow>=17",
  "duckdb>=1.1",
  "h3>=4.1",
  "onnxruntime>=1.20",
  "numpy>=2.0",
  "sentencepiece>=0.2",
  "sgp4>=2.23",
  "pillow>=10.4",
]

[project.scripts]
osint = "osint.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/osint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs a downloaded model or other large local data (skipped when absent)"]
filterwarnings = [
  "error",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]
